      <stop offset="1" stop-color="#232a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#c8102e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.6">
