  <rect x="70" y="540" width="200" height="42" rx="21" fill="#c8102e"/>
  <text x="170" y="568" font-family="Inter, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#ffffff">Explore Products →</text>

